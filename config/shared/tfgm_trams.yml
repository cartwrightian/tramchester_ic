gtfsSourceConfig:
  - name: tfgm
    hasFeedInfo: false
    transportModes: [ tram ]
    transportModesWithPlatforms: [ Tram ]
    initialWaitMinutes: 13
    noServices: []
    markedInterchangesOnly: false
    additionalInterchanges: [ ]
    groupedStationModes: []
    addWalksForClosed: true
    stationClosures: []
    temporaryStationsWalks:
    - stations:
        first: 9400ZZMAMCU
        second: 9400ZZMAIWM
      begin: 2026-09-26
      end: 2026-11-15
remoteSources:
  - name: tfgm
    dataURL: ${TRAM_DATAURL:- s3://tramchesternewdist/dist/${RELEASE_NUMBER}/tfgm_data.zip}
    dataCheckURL: https://odata.tfgm.com/opendata/downloads/TfGMgtfsnew.zip
    dataPath: data/tram
    downloadPath: data/tram
    filename: tfgm_data.zip
    defaultExpiryDays: 1
  - name: database
#    skip:
#      config: inMemoryGraph
    dataURL: ${DB_DATAURL:- s3://tramchesternewdist/dist/${RELEASE_NUMBER}/database.zip}
    dataCheckURL: ${DB_DATAURL:- s3://tramchesternewdist/dist/${RELEASE_NUMBER}/database.zip}
    dataPath: databases
    downloadPath: databases
    filename: database.zip
    defaultExpiryDays: 0
    modTimeCheckFilename: tramchester
    mandatory: false
    skipUpload: false
